<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Compare</title>
  <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">
  <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .flex { display: flex; gap: 0.5rem; align-items: center; }
    .flex-col { display: flex; flex-direction: column; gap: 0.5rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-2 { margin-bottom: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-muted { color: #6b7280; }
    .text-red { color: #ef4444; }
    .text-green { color: #22c55e; }
    .text-blue { color: #3b82f6; }
    .font-bold { font-weight: 600; }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 600; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .card { border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; background: white; }
    .table-list { list-style: none; padding: 0; margin: 0; max-height: 500px; overflow-y: auto; }
    .table-list li { padding: 0.5rem 0.75rem; cursor: pointer; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
    .table-list li:hover { background: #f9fafb; }
    .table-list li.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
    .sql-block { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; max-height: 350px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .diff-added { background: #f0fdf4; }
    .diff-removed { background: #fef2f2; }
    .diff-modified { background: #eff6ff; }
    table.diff-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.diff-table th, table.diff-table td { border: 1px solid #e5e7eb; padding: 0.35rem 0.5rem; text-align: left; }
    table.diff-table th { background: #f9fafb; font-weight: 600; }
    .nav { display: flex; gap: 0; border-bottom: 2px solid #e5e7eb; margin-bottom: 1rem; }
    .nav button { padding: 0.75rem 1.5rem; border: none; background: none; cursor: pointer; font-size: 0.9rem; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .nav button.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.running { background: #22c55e; }
    .status-dot.stopped { background: #ef4444; }
    .hidden { display: none !important; }
    label { font-size: 0.85rem; font-weight: 500; color: #374151; }
    input, select { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body data-signals="{view:'config',resultId:'',tables:[],selectedTable:null,detail:null,loading:false,sqlType:'upgrade',upgradeSql:'',rollbackSql:'',configFiles:[],selectedConfig:'',saveConfigName:'',source:{host:'localhost',port:3406,username:'root',password:'',database:''},target:{host:'localhost',port:3306,username:'root',password:'',database:''},ignoreFields:'',excludeTables:'',ignoreDataTables:'',specifiedPrimaryKeys:'',treeTableConfig:'',excludeDataRows:'',includeDataRows:'',envFiles:[],selectedEnv:'',env:{name:'',source:{port:3307,serviceName:'mysql',containerPrefix:'',codePath:'',composePath:'',gitRef:'',dbConfig:{username:'root',password:'',database:''}},target:{port:3308,serviceName:'mysql',containerPrefix:'',codePath:'',composePath:'',gitRef:'',dbConfig:{username:'root',password:'',database:''}},separateCodePath:false,ignoreFields:[],excludeTables:[],ignoreDataTables:[],specifiedPrimaryKeys:[],excludeDataRows:[],includeDataRows:[]},sourceStatus:false,targetStatus:false,dockerLoading:false}" data-init="@post('/api/config/list'); @post('/api/env/list')">

  <header style="background:#1e293b;color:white;padding:0.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;">
    <h1 style="margin:0;font-size:1.2rem;font-weight:600;">DB Compare</h1>
    <nav class="nav" style="border-bottom:none;margin:0;">
      <button data-on:click="$view='config'" data-class="{active:$view==='config'}" style="color:white;">Config</button>
      <button data-on:click="$view='result'" data-class="{active:$view==='result'}" style="color:white;" data-attr:disabled="!$resultId">Results</button>
      <button data-on:click="$view='env'" data-class="{active:$view==='env'}" style="color:white;">Environments</button>
    </nav>
  </header>

  <main class="container">

    <!-- ==================== CONFIG VIEW ==================== -->
    <div data-show="$view==='config'">
      <div class="card mb-2">
        <div class="grid-2">
          <div class="flex-col">
            <label>Load Config</label>
            <div class="flex">
              <select data-bind="selectedConfig" data-on:change="@post('/api/config/load', {payload:{filename:$selectedConfig}})" data-effect="renderSelectOptions(el, $configFiles, $selectedConfig, '-- select --')" style="flex:1">
                <option value="">-- select --</option>
              </select>
            </div>
          </div>
          <div class="flex-col">
            <label>Save Config</label>
            <div class="flex">
              <input data-bind="saveConfigName" placeholder="config name" style="flex:1">
              <button data-on:click="@post('/api/config/save', {payload:buildConfigSavePayload()})">Save</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3 style="margin:0 0 0.75rem">Source</h3>
          <div class="flex-col">
            <div class="flex">
              <div style="flex:3"><label>Host</label><input data-bind="source.host" value="localhost"></div>
              <div style="flex:1"><label>Port</label><input data-bind="source.port" type="number" value="3406"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>Username</label><input data-bind="source.username" value="root"></div>
              <div style="flex:1"><label>Password</label><input data-bind="source.password" type="password"></div>
            </div>
            <div><label>Database</label><input data-bind="source.database"></div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 0.75rem">Target</h3>
          <div class="flex-col">
            <div class="flex">
              <div style="flex:3"><label>Host</label><input data-bind="target.host" value="localhost"></div>
              <div style="flex:1"><label>Port</label><input data-bind="target.port" type="number" value="3306"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>Username</label><input data-bind="target.username" value="root"></div>
              <div style="flex:1"><label>Password</label><input data-bind="target.password" type="password"></div>
            </div>
            <div><label>Database</label><input data-bind="target.database"></div>
          </div>
        </div>
      </div>

      <div class="card mt-2">
        <details>
          <summary style="cursor:pointer;font-weight:600;">Options</summary>
          <div class="flex-col mt-1">
            <div><label>Ignore Fields</label><input data-bind="ignoreFields" placeholder="comma-separated, e.g. create_time or table.column"></div>
            <div><label>Exclude Tables</label><input data-bind="excludeTables" placeholder="comma-separated table names"></div>
            <div><label>Ignore Data Tables</label><input data-bind="ignoreDataTables" placeholder="comma-separated, skip data compare"></div>
            <div><label>Specified Primary Keys</label><input data-bind="specifiedPrimaryKeys" placeholder="table(col1,col2)"></div>
            <div><label>Tree Table Config</label><input data-bind="treeTableConfig" placeholder="table(id,parent_id)"></div>
            <div><label>Exclude Data Rows</label><input data-bind="excludeDataRows" placeholder="table(col=val)"></div>
            <div><label>Include Data Rows</label><input data-bind="includeDataRows" placeholder="table(col=val)"></div>
          </div>
        </details>
      </div>

      <div class="mt-2" style="text-align:center;">
        <button data-on:click="$loading = true; @post('/api/compare', {payload:buildComparePayload()})" data-attr:disabled="$loading" style="padding:0.75rem 2rem;font-size:1rem;">
          <span data-show="!$loading">Start Compare</span>
          <span data-show="$loading">Comparing...</span>
        </button>
      </div>
    </div>

    <!-- ==================== RESULT VIEW ==================== -->
    <div data-show="$view==='result'">
      <div style="display:flex;gap:1rem;height:calc(100vh - 120px);">
        <!-- Left: Table List -->
        <div class="card" style="width:280px;flex-shrink:0;display:flex;flex-direction:column;">
          <h3 style="margin:0 0 0.5rem">Tables</h3>
          <div style="flex:1;overflow-y:auto;">
            <ul class="table-list" data-effect="renderTableList(el, $tables, $selectedTable)"></ul>
          </div>
          <div class="mt-1 text-sm flex" style="justify-content:space-between;padding:0.5rem 0 0;border-top:1px solid #e5e7eb;">
            <span>Struct: <span class="badge badge-warn" data-text="$tables.filter(t => t.hasStructDiff).length"></span></span>
            <span>Data: <span class="badge badge-danger" data-text="$tables.filter(t => t.hasDataDiff).length"></span></span>
          </div>
          <div class="mt-1 flex">
            <button data-on:click="downloadSql('upgrade')" style="flex:1">Upgrade SQL</button>
            <button data-on:click="downloadSql('rollback')" style="flex:1">Rollback SQL</button>
          </div>
        </div>

        <!-- Right: Detail -->
        <div class="card" style="flex:1;overflow-y:auto;">
          <div data-show="!$detail && !$loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;">
            Select a table to view details
          </div>
          <div data-show="$loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;">
            Loading...
          </div>
          <div data-show="$detail && !$loading" data-effect="renderDetail(el, $detail)"></div>
        </div>
      </div>
    </div>

    <!-- ==================== ENV VIEW ==================== -->
    <div data-show="$view==='env'">
      <div class="card mb-2">
        <div class="flex" style="justify-content:space-between;">
          <div class="flex">
            <select data-bind="selectedEnv" data-on:change="@post('/api/env/load', {payload:{filename:$selectedEnv}})" data-effect="renderSelectOptions(el, $envFiles, $selectedEnv, '-- env config --')" style="width:200px">
              <option value="">-- env config --</option>
            </select>
            <button data-on:click="@post('/api/env/save', {payload:$env})">Save</button>
            <button data-on:click="@post('/api/env/generate', {payload:$env})">Generate</button>
          </div>
          <div class="flex">
            <input data-bind="env.name" placeholder="project name" style="width:200px">
          </div>
        </div>
      </div>

    <div class="grid-2" data-on-interval__duration.3s="$view==='env' && @post('/api/env/docker/status', {payload:$env})">
        <div class="card">
          <div class="flex" style="justify-content:space-between;margin-bottom:0.75rem;">
            <h3 style="margin:0">Target Environment</h3>
            <button data-show="!$targetStatus" data-on:click="$dockerLoading = true; @post('/api/env/docker/start', {payload:{type:'target', side:$env.target}})" data-attr:disabled="$dockerLoading" style="font-size:0.8rem;">Start</button>
            <button data-show="$targetStatus" data-on:click="$dockerLoading = true; @post('/api/env/docker/stop', {payload:{type:'target', side:$env.target}})" data-attr:disabled="$dockerLoading" style="font-size:0.8rem;background:#ef4444;color:white;">Stop</button>
          </div>
          <div class="flex-col">
            <div><label>Compose Path</label><input data-bind="env.target.composePath"></div>
            <div><label>Code Path</label><input data-bind="env.target.codePath"></div>
            <div class="flex">
              <div style="flex:1"><label>Service</label><input data-bind="env.target.serviceName" value="mysql"></div>
              <div style="flex:1"><label>Prefix</label><input data-bind="env.target.containerPrefix"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>Port</label><input data-bind="env.target.port" type="number" value="3308"></div>
              <div style="flex:1"><label>Git Ref</label><input data-bind="env.target.gitRef"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>DB User</label><input data-bind="env.target.dbConfig.username" value="root"></div>
              <div style="flex:1"><label>DB Pass</label><input data-bind="env.target.dbConfig.password" type="password"></div>
            </div>
            <div><label>Database</label><input data-bind="env.target.dbConfig.database"></div>
          </div>
        </div>
        <div class="card">
          <div class="flex" style="justify-content:space-between;margin-bottom:0.75rem;">
            <h3 style="margin:0">Source Environment</h3>
            <button data-show="!$sourceStatus" data-on:click="$dockerLoading = true; @post('/api/env/docker/start', {payload:{type:'source', side:$env.source}})" data-attr:disabled="$dockerLoading" style="font-size:0.8rem;">Start</button>
            <button data-show="$sourceStatus" data-on:click="$dockerLoading = true; @post('/api/env/docker/stop', {payload:{type:'source', side:$env.source}})" data-attr:disabled="$dockerLoading" style="font-size:0.8rem;background:#ef4444;color:white;">Stop</button>
          </div>
          <div class="flex-col">
            <div><label>Compose Path</label><input data-bind="env.source.composePath"></div>
            <div><label>Code Path</label><input data-bind="env.source.codePath"></div>
            <div class="flex">
              <div style="flex:1"><label>Service</label><input data-bind="env.source.serviceName" value="mysql"></div>
              <div style="flex:1"><label>Prefix</label><input data-bind="env.source.containerPrefix"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>Port</label><input data-bind="env.source.port" type="number" value="3307"></div>
              <div style="flex:1"><label>Git Ref</label><input data-bind="env.source.gitRef"></div>
            </div>
            <div class="flex">
              <div style="flex:1"><label>DB User</label><input data-bind="env.source.dbConfig.username" value="root"></div>
              <div style="flex:1"><label>DB Pass</label><input data-bind="env.source.dbConfig.password" type="password"></div>
            </div>
            <div><label>Database</label><input data-bind="env.source.dbConfig.database"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="toast" style="position:fixed;bottom:1rem;right:1rem;padding:0.75rem 1.25rem;border-radius:0.5rem;color:white;font-size:0.9rem;z-index:999;display:none;"></div>

  <script type="module">
    import { getPath } from 'https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js'

    const toast = function(msg, type='info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.background = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#3b82f6';
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }
    window.toast = toast

    const splitCsv = function(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(v => v);
      return val.split(',').map(s => s.trim()).filter(s => s);
    }
    window.splitCsv = splitCsv

    const buildComparePayload = () => ({
      source: getPath('source'),
      target: getPath('target'),
      ignoreFields: splitCsv(getPath('ignoreFields')),
      excludeTables: splitCsv(getPath('excludeTables')),
      ignoreDataTables: splitCsv(getPath('ignoreDataTables')),
      specifiedPrimaryKeys: splitCsv(getPath('specifiedPrimaryKeys')),
      treeTableConfig: splitCsv(getPath('treeTableConfig')),
      excludeDataRows: splitCsv(getPath('excludeDataRows')),
      includeDataRows: splitCsv(getPath('includeDataRows'))
    })
    window.buildComparePayload = buildComparePayload

    const buildConfigSavePayload = () => ({
      filename: getPath('saveConfigName'),
      ...buildComparePayload()
    })
    window.buildConfigSavePayload = buildConfigSavePayload

    window.renderSelectOptions = (select, items, selectedValue, placeholder) => {
      const normalizedItems = items || [];
      const currentValue = selectedValue ?? select.value ?? '';
      select.innerHTML = '';
      const placeholderOption = document.createElement('option');
      placeholderOption.value = '';
      placeholderOption.textContent = placeholder;
      select.appendChild(placeholderOption);
      for (const item of normalizedItems) {
        const option = document.createElement('option');
        option.value = String(item);
        option.textContent = String(item);
        select.appendChild(option);
      }
      select.value = normalizedItems.includes(currentValue) ? currentValue : '';
    };

    window.renderTableList = (list, tables, selectedTable) => {
      list.innerHTML = '';
      for (const table of tables || []) {
        const item = document.createElement('li');
        if (selectedTable === table.tableName) item.classList.add('active');
        item.setAttribute('data-on:click', `$loading = true; @post('/api/compare/table', {payload:{resultId:$resultId, tableName:${JSON.stringify(table.tableName)}}})`);

        const name = document.createElement('span');
        name.textContent = table.tableName;
        name.style.overflow = 'hidden';
        name.style.textOverflow = 'ellipsis';
        name.style.whiteSpace = 'nowrap';
        name.style.maxWidth = '160px';

        const badges = document.createElement('span');
        if (table.hasStructDiff) {
          const structBadge = document.createElement('span');
          structBadge.className = 'badge badge-warn';
          structBadge.textContent = 'S';
          badges.appendChild(structBadge);
        }
        if (table.hasDataDiff) {
          const dataBadge = document.createElement('span');
          dataBadge.className = 'badge badge-danger';
          dataBadge.textContent = 'D';
          badges.appendChild(dataBadge);
        }

        item.appendChild(name);
        item.appendChild(badges);
        list.appendChild(item);
      }
    };

    window.downloadSql = (type) => {
      const id = getPath('resultId');
      window.open('/api/compare/' + id + '/sql/download?type=' + type, '_blank');
    };

    window.renderDetail = (container, diff) => {
      if (!diff) {
        container.innerHTML = '';
        return;
      }

      let html = '';

      if (diff.structDiff) {
        const cols = (diff.structDiff.columns || []).filter(c => c.status !== 'EQUAL');
        const idxs = (diff.structDiff.indexes || []).filter(i => i.status !== 'EQUAL');

        if (cols.length || idxs.length) {
          html += '<h3>Structure Differences</h3>';

          if (cols.length) {
            html += '<h4>Columns</h4>';
            html += '<table class="diff-table"><thead><tr><th>Column</th><th>Source</th><th>Target</th><th>Status</th></tr></thead><tbody>';
            for (const c of cols) {
              const cls = c.status === 'REMOVED' ? 'diff-removed' : c.status === 'ADDED' ? 'diff-added' : 'diff-modified';
              html += `<tr class="${cls}"><td class="font-bold">${esc(c.name)}</td>`;
              html += `<td>${c.source ? formatCol(c.source) : '<span class="text-muted">--</span>'}</td>`;
              html += `<td>${c.target ? formatCol(c.target) : '<span class="text-muted">--</span>'}</td>`;
              html += `<td><span class="badge ${statusBadge(c.status)}">${c.status}</span></td></tr>`;
            }
            html += '</tbody></table>';
          }

          if (idxs.length) {
            html += '<h4 class="mt-2">Indexes & Keys</h4>';
            html += '<table class="diff-table"><thead><tr><th>Name</th><th>Source</th><th>Target</th><th>Status</th></tr></thead><tbody>';
            for (const i of idxs) {
              const cls = i.status === 'REMOVED' ? 'diff-removed' : i.status === 'ADDED' ? 'diff-added' : 'diff-modified';
              html += `<tr class="${cls}"><td class="font-bold">${esc(i.name)}</td>`;
              html += `<td>${i.source ? esc(i.source.type) + ': ' + (i.source.columns||[]).join(', ') : '<span class="text-muted">--</span>'}</td>`;
              html += `<td>${i.target ? esc(i.target.type) + ': ' + (i.target.columns||[]).join(', ') : '<span class="text-muted">--</span>'}</td>`;
              html += `<td><span class="badge ${statusBadge(i.status)}">${i.status}</span></td></tr>`;
            }
            html += '</tbody></table>';
          }
        }
      }

      if (diff.dataDiff) {
        const dd = diff.dataDiff;
        const hasAny = (dd.removed||[]).length || (dd.added||[]).length || (dd.modified||[]).length;
        if (hasAny) {
          html += '<h3 class="mt-2">Data Differences</h3>';
          if (diff.primaryKeys && diff.primaryKeys.length) {
            html += `<p class="text-sm"><span class="badge badge-info">PK: ${diff.primaryKeys.join(', ')}</span></p>`;
          }

          if (dd.removed && dd.removed.length) {
            html += `<h4 class="text-red">Source Only (Removed in Target) - ${dd.removed.length}</h4>`;
            html += renderDataTable(dd.removed, diff.primaryKeys);
          }
          if (dd.added && dd.added.length) {
            html += `<h4 class="text-green mt-2">Target Only (Added in Target) - ${dd.added.length}</h4>`;
            html += renderDataTable(dd.added, diff.primaryKeys);
          }
          if (dd.modified && dd.modified.length) {
            html += `<h4 class="text-blue mt-2">Modified Rows - ${dd.modified.length}</h4>`;
            html += renderModifiedTable(dd.modified, diff.primaryKeys);
          }
        }
      }

      html += '<h3 class="mt-2">SQL Scripts</h3>';
      html += '<div class="flex mb-2">';
      html += '<button data-on:click="$sqlType=\'upgrade\'" data-class:font-bold="$sqlType===\'upgrade\'">Upgrade</button>';
      html += '<button data-on:click="$sqlType=\'rollback\'" data-class:font-bold="$sqlType===\'rollback\'">Rollback</button>';
      html += '<button data-on:click="copySql($sqlType === \'upgrade\' ? $upgradeSql : $rollbackSql)" style="margin-left:auto;">Copy</button>';
      html += '</div>';
      html += '<div class="sql-block" data-text="$sqlType === \'upgrade\' ? ($upgradeSql || \'-- no SQL --\') : ($rollbackSql || \'-- no SQL --\')"></div>';

      container.innerHTML = html;
    };

    window.copySql = (sql) => {
      navigator.clipboard.writeText(sql || '');
      window.toast('Copied', 'success');
    };

    function renderDataTable(rows, pks) {
      if (!rows.length) return '';
      const keys = Object.keys(rows[0]).filter(k => !k.startsWith('_') || k.startsWith('__parent_'));
      const shown = rows.slice(0, 50);
      let html = '<table class="diff-table"><thead><tr>';
      for (const k of keys) {
        const isPk = pks && pks.includes(k);
        const label = k.startsWith('__parent_') ? k.substring(9) : k;
        html += `<th>${isPk ? '&#128273; ' : ''}${esc(label)}</th>`;
      }
      html += '</tr></thead><tbody>';
      for (const row of shown) {
        html += '<tr>';
        for (const k of keys) html += `<td>${esc(row[k])}</td>`;
        html += '</tr>';
      }
      html += '</tbody></table>';
      if (rows.length > 50) html += `<p class="text-xs text-muted text-center">... showing first 50 rows</p>`;
      return html;
    }

    function renderModifiedTable(rows, pks) {
      if (!rows.length) return '';
      const keys = Object.keys(rows[0]).filter(k => !k.startsWith('_') || k.startsWith('__parent_'));
      const shown = rows.slice(0, 50);
      let html = '<table class="diff-table"><thead><tr>';
      for (const k of keys) {
        const isPk = pks && pks.includes(k);
        const label = k.startsWith('__parent_') ? k.substring(9) : k;
        html += `<th>${isPk ? '&#128273; ' : ''}${esc(label)}</th>`;
      }
      html += '</tr></thead><tbody>';
      for (const row of shown) {
        html += '<tr>';
        for (const k of keys) {
          const src = row._source ? row._source[k] : undefined;
          const tgt = row[k];
          if (row._source && src !== tgt) {
            html += `<td class="diff-modified"><div class="text-red" style="text-decoration:line-through;font-size:0.8em;">${esc(src)}</div><div class="text-green font-bold">${esc(tgt)}</div></td>`;
          } else {
            html += `<td>${esc(tgt)}</td>`;
          }
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      if (rows.length > 50) html += `<p class="text-xs text-muted text-center">... showing first 50 rows</p>`;
      return html;
    }

    function formatCol(col) {
      const def = col.defaultValue != null ? ('VARCHAR' === col.typeName ? `DEFAULT '${col.defaultValue}'` : `DEFAULT ${col.defaultValue}`) : '';
      return `${col.typeName}(${col.columnSize}) ${col.isNullable ? 'NULL' : 'NOT NULL'} ${col.isAutoIncrement ? 'AUTO_INCREMENT' : ''} ${def}`;
    }

    function statusBadge(s) {
      if (s === 'ADDED') return 'badge-ok';
      if (s === 'REMOVED') return 'badge-danger';
      if (s === 'MODIFIED') return 'badge-info';
      return '';
    }

    function esc(v) {
      if (v === null || v === undefined) return '<span class="text-muted">NULL</span>';
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

  </script>
</body>
</html>
