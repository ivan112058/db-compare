<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Compare</title>
    <link rel="stylesheet" href="/css/oat.min.css">
    <link rel="stylesheet" href="/css/chip.min.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>

<body class="config-body" data-theme="stone">
<form id="config-form">
    <article class="card">
        <header class="flex justify-between">
            <h3>Configuration</h3>
            <a href="/env">env management</a>
        </header>
        <div class="flex gap-4">
            <label data-field style="flex:1">
                Load Config
                <select id="config-select" data-init="@get('/api/configs')" data-bind="selectedConfig"
                        data-on:change="$selectedConfig && @get('/api/configs/' + encodeURIComponent($selectedConfig))"
                        style="margin:0">
                </select>
            </label>
            <label data-field style="flex:1">
                Save Config
                <fieldset class="group">
                    <input type="text" name="saveConfigName" placeholder="Config Name (e.g. my-config)"/>
                    <button data-on:click="@put('/api/configs/' + encodeURIComponent(document.querySelector('input[name=saveConfigName]').value), {contentType: 'form'})">
                        Save
                    </button>
                </fieldset>
            </label>
        </div>
    </article>

    <div class="flex gap-4 mt-4">
        <article class="card" style="flex:1">
            <header>
                <h3>Target</h3>
            </header>
            <div class="flex gap-2">
                <label data-field style="flex:3">
                    Host
                    <input type="text" name="target.host" value="localhost"/>
                </label>
                <label data-field style="flex:1">
                    Port
                    <input type="number" name="target.port" value="3306"/>
                </label>
            </div>
            <div class="flex gap-2">
                <label data-field style="flex:1">
                    Username
                    <input type="text" name="target.username" value="root"/>
                </label>
                <label data-field style="flex:1">
                    Password
                    <input type="password" name="target.password"/>
                </label>
            </div>
            <label data-field>
                Database
                <input type="text" name="target.database"/>
            </label>
        </article>
        <article class="card" style="flex:1">
            <header>
                <h3>Source</h3>
            </header>
            <div class="flex gap-2">
                <label data-field style="flex:3">
                    Host
                    <input type="text" name="source.host" value="localhost"/>
                </label>
                <label data-field style="flex:1">
                    Port
                    <input type="number" name="source.port" value="3306"/>
                </label>
            </div>
            <div class="flex gap-2">
                <label data-field style="flex:1">
                    Username
                    <input type="text" name="source.username" value="root"/>
                </label>
                <label data-field style="flex:1">
                    Password
                    <input type="password" name="source.password"/>
                </label>
            </div>
            <label data-field>
                Database
                <input type="text" name="source.database"/>
            </label>
        </article>
    </div>

    <article class="card mt-4">
        <header>
            <h3>Options</h3>
        </header>
        <label data-field>
            Ignore Fields
            <oat-chip-input name="ignoreFields"
                            placeholder="e.g. create_time, table.column. Press ENTER to add."></oat-chip-input>
            <small data-hint>Columns that should be ignored during comparison. Global or table-specific.</small>
        </label>
        <label data-field>
            Exclude Tables
            <oat-chip-input name="excludeTables" placeholder="Table names. Press ENTER to add."></oat-chip-input>
            <small data-hint>Tables that should be excluded from comparison.</small>
        </label>
        <label data-field>
            Ignore Data Tables
            <oat-chip-input name="ignoreDataTables" placeholder="Table names. Press ENTER to add."></oat-chip-input>
            <small data-hint>Tables whose data should be ignored during comparison.</small>
        </label>
        <label data-field>
            Specified Primary Keys
            <oat-chip-input name="specifiedPrimaryKeys"
                            placeholder="table(col1,col2). Press ENTER to add."></oat-chip-input>
            <small data-hint>Primary keys that should be used for comparison.</small>
        </label>
        <label data-field>
            Tree Table Config
            <oat-chip-input name="treeTableConfig"
                            placeholder="table(id,parent_id). Press ENTER to add."></oat-chip-input>
            <small data-hint>Tree-structured tables. MUST set Specified Primary Keys.</small>
        </label>
        <label data-field>
            Exclude Data Rows
            <oat-chip-input name="excludeDataRows"
                            placeholder="table(col=val). Press ENTER to add."></oat-chip-input>
            <small data-hint>Rows that should be excluded from comparison. This config will be ignored if Include
                Data
                Rows is set.</small>
        </label>
        <label data-field>
            Include Data Rows
            <oat-chip-input name="includeDataRows"
                            placeholder="table(col=val). Press ENTER to add."></oat-chip-input>
            <small data-hint>Rows that should be included in comparison.</small>
        </label>
    </article>

    <div class="align-center mt-4">
        <button data-indicator:_loading data-show="!$_loading"
                data-on:click="@post('/api/compare', {contentType: 'form'})">
            Start Comparison
        </button>
        <button data-show="$_loading" aria-busy="true" data-spinner="small" disabled>Loading</button>
    </div>
</form>

<script src="/js/oat-chip-input.js" defer></script>
<script src="/js/oat.min.js" defer></script>
<script src="/js/chip.min.js" defer></script>
<script type="module" src="/js/datastar.js"></script>
</body>

</html>
