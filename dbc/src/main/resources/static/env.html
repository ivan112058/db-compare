<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Compare</title>
    <link rel="stylesheet" href="css/oat.min.css">
    <link rel="stylesheet" href="css/chip.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <script defer type="module"
            src="https://cdn.jsdelivr.net/gh/dataSPA/dataSPA-inspector@main/dataspa-inspector.bundled.js"></script>
</head>

<body style="max-width: 1100px; margin: 0 auto; padding: var(--space-4);" data-theme="stone">
<dataspa-inspector></dataspa-inspector>
<button class="chip" data-on:click="window.history.back()">Back to config</button>

<form id="env-config-form">
    <article class="card mt-4">
        <header>
            <h3>Environment Management</h3>
        </header>
        <div class="flex gap-4">
            <label data-field style="flex:1">
                Load env Config
                <select id="env-config-select" data-init="@get('/api/env')" data-bind="selectedConfig"
                        data-on:change="$selectedConfig && @post('/api/env')" style="margin:0">
                </select>
            </label>
            <label data-field style="flex:1">
                Project Name
                <fieldset class="group" style="flex:1">
                    <input type="text" name="projectName" placeholder="Project Name (e.g. my-project)"/>
                    <button
                            data-on:click="@put('/api/env', {contentType: 'form'})">Save
                    </button>
                </fieldset>
            </label>
        </div>
    </article>


    <article class="card mt-4">
        <header>
            <h3>Env config</h3>
        </header>
        <div class="container" style="padding-inline: 0;">
            <div class="row">
                <label class="col-6">
                    <input type="checkbox" role="switch" name="separateCodePath" data-bind="_separateCodePath"/>
                    Separate code path
                </label>
                <label class="col-6">
                    <input type="checkbox" role="switch" name="sameDBConfig" data-bind="_sameDBConfig" checked/>
                    Source DB Config same as Target
                </label>
            </div>
        </div>
    </article>

    <div class="flex gap-4 mt-4">
        <article class="card" style="flex:1">
            <header class="hstack justify-between">
                <h3>Target</h3>
                <button class="chip" data-signals:target.running="false"
                        data-indicator:target.loading
                        data-class="{success: !$target.running, danger: $target.running}"
                        data-text="$target.running ? 'Stop' : 'Start'"
                        data-attr-disabled="$target.loading"
                        data-on:click="$target.running ? @post('/api/env/docker/stop?type=target', {contentType: 'form'}) : @post('/api/env/docker/start?type=target', {contentType: 'form'})">
                </button>
            </header>
            <div class="container" style="padding-inline: 0;">
                <div class="row">
                    <label data-field class="col-12">
                        Docker Compose Path
                        <input type="text" name="target.composePath"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-12">
                        Code Path
                        <input type="text" name="target.codePath"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-12">
                        Git ref
                        <input type="text" name="target.gitref" value="dev"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-6">
                        Container name prefix
                        <input type="text" name="target.prefix" value="target"/>
                    </label>
                    <label data-field class="col-6">
                        Container port
                        <input type="number" name="target.port" value="3310"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-6">
                        MySQL service name
                        <input type="text" name="target.service" value="mysql"/>
                    </label>
                    <label data-field class="col-6">
                        Database
                        <input type="text" name="target.database"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-6">
                        DB Username
                        <input type="text" name="target.username" value="root"/>
                    </label>
                    <label data-field class="col-6">
                        DB Password
                        <input type="password" name="target.password"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-12">
                        Exclude init SQL
                        <oat-chip-input name="target.excludeInitSql"
                                        placeholder="SQL filenames to skip. Press ENTER to add."></oat-chip-input>
                    </label>
                </div>
            </div>
        </article>
        <article class="card" style="flex:1">
            <header class="hstack justify-between">
                <h3>Source</h3>
                <button class="chip" data-signals:source.running="false"
                        data-indicator:source.loading
                        data-class="{success: !$source.running, danger: $source.running}"
                        data-text="$source.running ? 'Stop' : 'Start'"
                        data-attr-disabled="$source.loading"
                        data-on:click="$source.running ? @post('/api/env/docker/stop?type=source', {contentType: 'form'}) : @post('/api/env/docker/start?type=source', {contentType: 'form'})">
                </button>
            </header>
            <div class="container" style="padding-inline: 0;">
                <div class="row" data-show="$_separateCodePath">
                    <label data-field class="col-12">
                        Docker Compose Path
                        <input type="text" name="source.composePath"/>
                    </label>
                </div>
                <div class="row" data-show="$_separateCodePath">
                    <label data-field class="col-12">
                        Code Path
                        <input type="text" name="source.codePath"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-12">
                        Git ref
                        <input type="text" name="source.gitref" value="main"/>
                    </label>
                </div>
                <div class="row">
                    <label data-field class="col-6">
                        Container name prefix
                        <input type="text" name="source.prefix" value="source"/>
                    </label>
                    <label data-field class="col-6">
                        Container port
                        <input type="number" name="source.port" value="3320"/>
                    </label>
                </div>
                <div class="row" data-show="!$_sameDBConfig">
                    <label data-field class="col-6">
                        MySQL service name
                        <input type="text" name="source.service" value="mysql"/>
                    </label>
                    <label data-field class="col-6">
                        Database
                        <input type="text" name="source.database"/>
                    </label>
                </div>
                <div class="row" data-show="!$_sameDBConfig">
                    <label data-field class="col-6">
                        DB Username
                        <input type="text" name="source.username" value="root"/>
                    </label>
                    <label data-field class="col-6">
                        DB Password
                        <input type="password" name="source.password"/>
                    </label>
                </div>
                <div class="row" data-show="$_separateCodePath">
                    <label data-field class="col-12">
                        Exclude init SQL
                        <oat-chip-input name="source.excludeInitSql"
                                        placeholder="SQL filenames to skip. Press ENTER to add."></oat-chip-input>
                    </label>
                </div>
            </div>
        </article>
    </div>

    <div class="align-center mt-4">
        <button data-on:click="@post('/api/env/generate', {contentType: 'form'})">
            Save and Generate Config
        </button>
    </div>
</form>

<script src="js/oat-chip-input.js" defer></script>
<script src="js/oat.min.js" defer></script>
<script src="js/chip.min.js" defer></script>
<script type="module" src="js/datastar.js"></script>
</body>
